<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mezon SFU 2-Participant Test Client</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1e1e2e;
            color: #cdd6f4;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }
        .container {
            background: #313244;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #181825;
            border: 1px solid #45475a;
            color: #cdd6f4;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background: #89b4fa;
            color: #11111b;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #b4befe;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #45475a;
            font-family: monospace;
        }
        /* Video Grid Layout for 2 Participants */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .video-box {
            background: #11111b;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        video {
            width: 100%;
            max-height: 350px;
            background: #000;
            border-radius: 6px;
        }
        .local-video {
            transform: scaleX(-1); /* Mirror local video only */
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Mezon SFU Client (2 Participants)</h2>

    <div class="form-group">
        <label for="wsUrl">Signaling WebSocket URL</label>
        <input type="text" id="wsUrl" value="wss://test-sfu.nccsoft.vn/ws">
    </div>

    <div class="form-group">
        <label for="roomId">Room ID</label>
        <input type="text" id="roomId" value="101">
    </div>

    <button id="startBtn" onclick="connectAndJoin()">Connect & Join Room</button>

    <div id="status">Status: Initializing Camera...</div>

    <div class="video-grid">
        <div class="video-box">
            <label>Local User (You)</label>
            <video id="localVideo" class="local-video" autoplay playsinline muted></video>
        </div>
        <div class="video-box">
            <label>Remote Participant</label>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>
</div>

<script>
let ws = null;
    let pc = null;
    let localStream = null;
    let remoteStream = null;

    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    // 1. Initialize available hardware on load
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            // Check what devices are actually connected to the system
            const devices = await navigator.mediaDevices.enumerateDevices();
            const hasVideo = devices.some(device => device.kind === 'videoinput');
            const hasAudio = devices.some(device => device.kind === 'audioinput');

            // Fallback cleanly if no media inputs exist anywhere
            if (!hasVideo && !hasAudio) {
                updateStatus("No camera or microphone found. You can still join to watch/listen.");
                localStream = new MediaStream(); // Empty stream container
                return;
            }

            // Build constraints dynamically based on physical hardware presence
            const constraints = {
                video: hasVideo,
                audio: hasAudio
            };

            localStream = await navigator.mediaDevices.getUserMedia(constraints);

            if (hasVideo) {
                document.getElementById('localVideo').srcObject = localStream;
            }

            updateStatus("Media initialized. Ready to connect and join room.");
        } catch (e) {
            console.error("Media initialization error:", e);
            // Handle permission denials safely without breaking the client execution completely
            updateStatus("Media access denied. Joining as receiver-only.", false);
            localStream = new MediaStream(); // Clean fallback state
        }
    });

    function updateStatus(msg, isError = false) {
        statusDiv.innerText = `Status: ${msg}`;
        statusDiv.style.color = isError ? '#f38ba8' : '#a6e3a1';
    }

    // 2. Connect to server
    async function connectAndJoin() {
        const wsUrl = document.getElementById('wsUrl').value;
        const roomId = document.getElementById('roomId').value;

        if (!roomId) {
            updateStatus("Please enter a Room ID", true);
            return;
        }

        startBtn.disabled = true;
        updateStatus("Preparing WebRTC PeerConnection...");

        try {
            const config = { iceServers: [] };
            pc = new RTCPeerConnection(config);

            remoteStream = new MediaStream();
            document.getElementById('remoteVideo').srcObject = remoteStream;

            pc.ontrack = (event) => {
                console.log("Remote track received:", event.track.kind);
                event.streams[0].getTracks().forEach(track => {
                    remoteStream.addTrack(track);
                });
                updateStatus("Connected! Remote participant's video is rendering.");
            };

            // Push whatever local tracks we managed to initialize (could be 0, 1, or 2)
            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            // If local hardware was completely missing, force transceiver slots to match
            // the SFU's expected structure so it still negotiates standard layouts cleanly.
            const transceivers = pc.getTransceivers();
            if (!transceivers.some(t => t.receiver.track.kind === 'audio')) {
                pc.addTransceiver('audio', { direction: 'recvonly' });
            }
            if (!transceivers.some(t => t.receiver.track.kind === 'video')) {
                pc.addTransceiver('video', { direction: 'recvonly' });
            }

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            updateStatus("Connecting to signaling server...");
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                updateStatus("Connected! Joining room and publishing offer...");

                const joinMsg = {
                    type: "join",
                    room: roomId
                };
                ws.send(JSON.stringify(joinMsg));

                setTimeout(() => {
                    const offerMsg = {
                        type: "offer",
                        sdp: pc.localDescription.sdp
                    };
                    ws.send(JSON.stringify(offerMsg));
                }, 100);
            };

            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                console.log("Signaling received:", msg);

                if (msg.type === "error") {
                    updateStatus(`Error: ${msg.message}`, true);
                    startBtn.disabled = false;
                    return;
                }

                if (msg.type === "answer") {
                    updateStatus("SDP Answer received. Media connection active. Waiting for peer...");
                    await pc.setRemoteDescription(new RTCSessionDescription({
                        type: 'answer',
                        sdp: msg.sdp
                    }));
                }
            };

            ws.onclose = () => {
                updateStatus("Signaling link disconnected.", true);
                startBtn.disabled = false;
                if (pc) pc.close();
            };

            ws.onerror = (err) => {
                updateStatus("Signaling WebSocket error.", true);
                startBtn.disabled = false;
            };

        } catch (e) {
            console.error("Connection failed:", e);
            updateStatus(`WebRTC failed: ${e.message}`, true);
            startBtn.disabled = false;
        }
    }
</script>
</body>
</html>
