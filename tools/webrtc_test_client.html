<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Mezon SFU 2-Participant Test Client</title>
        <style>
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: #1e1e2e;
                color: #cdd6f4;
                max-width: 1000px;
                margin: 40px auto;
                padding: 20px;
            }
            .container {
                background: #313244;
                padding: 25px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            }
            .form-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
            }
            input {
                width: 100%;
                padding: 10px;
                background: #181825;
                border: 1px solid #45475a;
                color: #cdd6f4;
                border-radius: 6px;
                box-sizing: border-box;
            }
            button {
                background: #89b4fa;
                color: #11111b;
                border: none;
                padding: 12px 20px;
                font-weight: bold;
                border-radius: 6px;
                cursor: pointer;
                width: 100%;
            }
            button:hover {
                background: #b4befe;
            }
            #status {
                margin-top: 15px;
                padding: 10px;
                border-radius: 6px;
                background: #45475a;
                font-family: monospace;
            }
            .video-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                margin-top: 20px;
            }
            .video-box {
                background: #11111b;
                border-radius: 8px;
                padding: 10px;
                text-align: center;
            }
            video {
                width: 100%;
                max-height: 350px;
                background: #000;
                border-radius: 6px;
            }
            .local-video {
                transform: scaleX(-1);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Mezon SFU Client (2 Participants)</h2>

            <div class="form-group">
                <label for="wsUrl">Signaling WebSocket URL</label>
                <input
                    type="text"
                    id="wsUrl"
                    value="wss://test-sfu.nccsoft.vn/ws"
                />
            </div>

            <div class="form-group">
                <label for="roomId">Room ID</label>
                <input type="text" id="roomId" value="101" />
            </div>

            <button id="startBtn" onclick="connectAndJoin()">
                Connect & Join Room
            </button>

            <div id="status">Status: Initializing Camera...</div>

            <div class="video-grid">
                <div class="video-box">
                    <label>Local User (You)</label>
                    <video
                        id="localVideo"
                        class="local-video"
                        autoplay
                        playsinline
                        muted
                    ></video>
                </div>
                <div class="video-box">
                    <label>Remote Participant</label>
                    <!-- Unmuted to allow audio playback -->
                    <video id="remoteVideo" autoplay playsinline></video>
                </div>
            </div>
        </div>

        <script>
            let ws = null;
            let pc = null;
            let localStream = null;
            let remoteStream = null;
            let isInitialOfferSent = false;

            const statusDiv = document.getElementById("status");
            const startBtn = document.getElementById("startBtn");

            window.addEventListener("DOMContentLoaded", async () => {
                // Avoid calling enumerateDevices() prior to permission grant, as Chrome
                // hides device IDs/labels before permission is granted.
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: true,
                    });
                } catch (e) {
                    console.warn("Audio/Video access failed, trying audio-only fallback:", e);
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({
                            video: false,
                            audio: true,
                        });
                    } catch (err) {
                        console.warn("Audio access failed. Joining as receiver-only:", err);
                        localStream = new MediaStream();
                    }
                }

                const videoTrack = localStream.getVideoTracks()[0];
                const audioTrack = localStream.getAudioTracks()[0];

                if (videoTrack) {
                    document.getElementById("localVideo").srcObject = localStream;
                }

                if (videoTrack && audioTrack) {
                    updateStatus("Media initialized (Audio + Video). Ready to connect.");
                } else if (audioTrack) {
                    updateStatus("Media initialized (Audio Only). Ready to connect.");
                } else {
                    updateStatus("No media input found. Joining as receiver-only.");
                }
            });

            function updateStatus(msg, isError = false) {
                statusDiv.innerText = `Status: ${msg}`;
                statusDiv.style.color = isError ? "#f38ba8" : "#a6e3a1";
            }

            async function connectAndJoin() {
                const wsUrl = document.getElementById("wsUrl").value;
                const roomId = document.getElementById("roomId").value;

                if (!roomId) {
                    updateStatus("Please enter a Room ID", true);
                    return;
                }

                startBtn.disabled = true;
                updateStatus("Preparing WebRTC PeerConnection...");

                try {
                    pc = new RTCPeerConnection({
                      iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        {
                          urls:'turn:relay.mezon.vn:5349',
                          username:'turnmezon',
                          credential:'QuTs4zUEcbylWemXL7MK'
                        }
                      ]
                    });
                    remoteStream = new MediaStream();

                    const remoteVideoEl = document.getElementById("remoteVideo");
                    remoteVideoEl.muted = false;
                    remoteVideoEl.volume = 1.0;
                    remoteVideoEl.srcObject = remoteStream;

                    let isRenegotiating = false;

                    pc.onnegotiationneeded = async () => {
                        if (!isInitialOfferSent || isRenegotiating || pc.signalingState !== "stable") {
                            return;
                        }
                        try {
                            isRenegotiating = true;
                            console.log("Browser triggered onnegotiationneeded. Sending updated offer...");
                            const offer = await pc.createOffer();
                            await pc.setLocalDescription(offer);
                            ws.send(JSON.stringify({ type: "offer", sdp: pc.localDescription.sdp }));
                        } catch (err) {
                            console.error("Renegotiation offer generation failed:", err);
                        } finally {
                            isRenegotiating = false;
                        }
                    };

                    pc.ontrack = (event) => {
                        console.log(
                            "Remote track received:",
                            event.track.kind,
                            event.track,
                        );
                        remoteStream.addTrack(event.track);

                        if (remoteVideoEl.srcObject !== remoteStream) {
                            remoteVideoEl.srcObject = remoteStream;
                        }

                        remoteVideoEl
                            .play()
                            .catch((e) =>
                                console.warn("Playout auto-play notice:", e),
                            );
                        updateStatus(
                            `Connected! Remote ${event.track.kind} track active.`,
                        );
                    };

                    // addTrack creates sendrecv transceivers and assigns SSRCs reliably across browsers.
                    const audioTrack = localStream ? localStream.getAudioTracks()[0] : null;
                    const videoTrack = localStream ? localStream.getVideoTracks()[0] : null;

                    if (audioTrack) {
                        pc.addTrack(audioTrack, localStream);
                    } else {
                        pc.addTransceiver("audio", { direction: "recvonly" });
                    }

                    if (videoTrack) {
                        pc.addTrack(videoTrack, localStream);
                    } else {
                        pc.addTransceiver("video", { direction: "recvonly" });
                    }

                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);

                    updateStatus("Connecting to signaling server...");
                    ws = new WebSocket(wsUrl);

                    ws.onopen = () => {
                        updateStatus(
                            "Connected! Joining room and publishing offer...",
                        );
                        ws.send(JSON.stringify({ type: "join", room: roomId }));

                        setTimeout(() => {
                            ws.send(
                                JSON.stringify({
                                    type: "offer",
                                    sdp: pc.localDescription.sdp,
                                }),
                            );
                            isInitialOfferSent = true;
                        }, 100);
                    };

                    ws.onmessage = async (event) => {
                        const msg = JSON.parse(event.data);
                        console.log("Signaling received:", msg);

                        if (msg.type === "error") {
                            updateStatus(`Error: ${msg.message}`, true);
                            startBtn.disabled = false;
                            return;
                        }

                        if (msg.type === "answer") {
                            updateStatus(
                                "SDP Answer received. Media connection active!",
                            );
                            await pc.setRemoteDescription(
                                new RTCSessionDescription({
                                    type: "answer",
                                    sdp: msg.sdp,
                                }),
                            );
                        }

                        if (msg.type === "offer") {
                            console.log(
                                "Server initiated renegotiation offer for new peer",
                            );
                            updateStatus(
                                "New participant joined! Establishing media bridge...",
                            );
                            await pc.setRemoteDescription(
                                new RTCSessionDescription({
                                    type: "offer",
                                    sdp: msg.sdp,
                                }),
                            );
                            const answer = await pc.createAnswer();
                            await pc.setLocalDescription(answer);
                            ws.send(
                                JSON.stringify({
                                    type: "answer",
                                    sdp: pc.localDescription.sdp,
                                }),
                            );
                        }

                        if (
                            msg.type === "renegotiate" ||
                            msg.type === "peer-joined"
                        ) {
                            if (
                                isRenegotiating ||
                                pc.signalingState !== "stable"
                            ) {
                                console.log(
                                    "Renegotiation requested but already negotiating or unstable. Skipping.",
                                );
                                return;
                            }
                            console.log("Server requested renegotiation");
                            updateStatus(
                                "Renegotiating session for new participant...",
                            );
                            const offer = await pc.createOffer();
                            await pc.setLocalDescription(offer);
                            ws.send(
                                JSON.stringify({
                                    type: "offer",
                                    sdp: pc.localDescription.sdp,
                                }),
                            );
                        }
                    };

                    ws.onclose = () => {
                        updateStatus("Signaling link disconnected.", true);
                        startBtn.disabled = false;
                        isInitialOfferSent = false;
                        if (pc) pc.close();
                    };

                    ws.onerror = () => {
                        updateStatus("Signaling WebSocket error.", true);
                        startBtn.disabled = false;
                    };
                } catch (e) {
                    console.error("Connection failed:", e);
                    updateStatus(`WebRTC failed: ${e.message}`, true);
                    startBtn.disabled = false;
                    isInitialOfferSent = false;
                }
            }
        </script>
    </body>
</html>
