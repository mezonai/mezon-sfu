<script>
    let ws = null;
    let pc = null;
    let localStream = null;
    let remoteStream = null;
    let isInitialOfferSent = false; // Prevents race condition between manual offer and automated handler

    let statusDiv;
    const startBtn = document.getElementById("startBtn");

    window.addEventListener("DOMContentLoaded", async () => {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const hasVideo = devices.some(
                (device) => device.kind === "videoinput",
            );
            const hasAudio = devices.some(
                (device) => device.kind === "audioinput",
            );

            if (!hasVideo && !hasAudio) {
                updateStatus(
                    "No camera or microphone found. Joining as receiver-only.",
                );
                localStream = new MediaStream();
                return;
            }

            localStream = await navigator.mediaDevices.getUserMedia({
                video: hasVideo,
                audio: hasAudio,
            });

            if (hasVideo) {
                // Dynamic element lookup with safety check
                const localVideoEl = document.getElementById("localVideo");
                if (localVideoEl) {
                    localVideoEl.srcObject = localStream;
                } else {
                    console.warn("localVideo element not found in DOM yet.");
                }
            }

            updateStatus("Media initialized. Ready to connect and join room.");
        } catch (e) {
            console.error("Media initialization error:", e);
            updateStatus(
                "Media access denied. Joining as receiver-only.",
                false,
            );
            localStream = new MediaStream();
        }
    });

    function updateStatus(msg, isError = false) {
        // Lazily fetch the element if we haven't already
        if (!statusDiv) {
            statusDiv = document.getElementById("status");
        }

        // Safety check in case the DOM really hasn't built it yet
        if (statusDiv) {
            statusDiv.innerText = `Status: ${msg}`;
            statusDiv.style.color = isError ? "#f38ba8" : "#a6e3a1";
        } else {
            console.log(`Status Drop: ${msg}`); // Fallback so you don't lose logs
        }
    }

    async function connectAndJoin() {
        const wsUrl = document.getElementById("wsUrl").value;
        const roomId = document.getElementById("roomId").value;

        if (!roomId) {
            updateStatus("Please enter a Room ID", true);
            return;
        }

        startBtn.disabled = true;
        updateStatus("Preparing WebRTC PeerConnection...");

        try {
            pc = new RTCPeerConnection({ iceServers: [] });
            remoteStream = new MediaStream();

            const remoteVideoEl = document.getElementById("remoteVideo");
            remoteVideoEl.muted = false;
            remoteVideoEl.volume = 1.0;
            remoteVideoEl.srcObject = remoteStream;

            let isRenegotiating = false;

            pc.onnegotiationneeded = async () => {
                // Critical Fix: Ignore automated triggers until our initial handshakes are fully completed
                if (
                    !isInitialOfferSent ||
                    isRenegotiating ||
                    pc.signalingState !== "stable"
                ) {
                    return;
                }
                try {
                    isRenegotiating = true;
                    console.log(
                        "Browser triggered onnegotiationneeded. Sending updated offer...",
                    );
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    ws.send(
                        JSON.stringify({
                            type: "offer",
                            sdp: pc.localDescription.sdp,
                        }),
                    );
                } catch (err) {
                    console.error(
                        "Renegotiation offer generation failed:",
                        err,
                    );
                } finally {
                    isRenegotiating = false;
                }
            };

            pc.ontrack = (event) => {
                console.log(
                    "Remote track received:",
                    event.track.kind,
                    event.track,
                );
                remoteStream.addTrack(event.track);

                if (remoteVideoEl.srcObject !== remoteStream) {
                    remoteVideoEl.srcObject = remoteStream;
                }

                remoteVideoEl
                    .play()
                    .catch((e) => console.warn("Playout auto-play notice:", e));
                updateStatus(
                    `Connected! Remote ${event.track.kind} track active.`,
                );
            };

            // Setup transceivers in a strict order (Audio first, Video second)
            const audioTrack = localStream
                ? localStream.getAudioTracks()[0]
                : null;
            const videoTrack = localStream
                ? localStream.getVideoTracks()[0]
                : null;

            if (audioTrack) {
                pc.addTransceiver(audioTrack, {
                    direction: "sendrecv",
                    streams: [localStream],
                });
            } else {
                pc.addTransceiver("audio", { direction: "recvonly" });
            }

            if (videoTrack) {
                pc.addTransceiver(videoTrack, {
                    direction: "sendrecv",
                    streams: [localStream],
                });
            } else {
                pc.addTransceiver("video", { direction: "recvonly" });
            }

            // Create initial local description before opening the websocket connection
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            updateStatus("Connecting to signaling server...");
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                updateStatus("Connected! Joining room and publishing offer...");
                ws.send(JSON.stringify({ type: "join", room: roomId }));

                setTimeout(() => {
                    ws.send(
                        JSON.stringify({
                            type: "offer",
                            sdp: pc.localDescription.sdp,
                        }),
                    );
                    isInitialOfferSent = true; // Safely unlock future renegotiations now
                }, 100);
            };

            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                console.log("Signaling received:", msg);

                if (msg.type === "error") {
                    updateStatus(`Error: ${msg.message}`, true);
                    startBtn.disabled = false;
                    return;
                }

                if (msg.type === "answer") {
                    updateStatus(
                        "SDP Answer received. Media connection active!",
                    );
                    await pc.setRemoteDescription(
                        new RTCSessionDescription({
                            type: "answer",
                            sdp: msg.sdp,
                        }),
                    );
                }

                if (msg.type === "offer") {
                    console.log(
                        "Server initiated renegotiation offer for new peer",
                    );
                    updateStatus(
                        "New participant joined! Establishing media bridge...",
                    );
                    await pc.setRemoteDescription(
                        new RTCSessionDescription({
                            type: "offer",
                            sdp: msg.sdp,
                        }),
                    );
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    ws.send(
                        JSON.stringify({
                            type: "answer",
                            sdp: pc.localDescription.sdp,
                        }),
                    );
                }

                if (msg.type === "renegotiate" || msg.type === "peer-joined") {
                    if (isRenegotiating || pc.signalingState !== "stable") {
                        console.log(
                            "Server requested renegotiation, but context is busy/unstable. Skipping.",
                        );
                        return;
                    }
                    console.log(
                        "Server explicitly requested a session renegotiation.",
                    );
                    updateStatus(
                        "Renegotiating session for new participant...",
                    );
                    try {
                        isRenegotiating = true;
                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        ws.send(
                            JSON.stringify({
                                type: "offer",
                                sdp: pc.localDescription.sdp,
                            }),
                        );
                    } catch (err) {
                        console.error("Explicit renegotiation failed:", err);
                    } finally {
                        isRenegotiating = false;
                    }
                }
            };

            ws.onclose = () => {
                updateStatus("Signaling link disconnected.", true);
                startBtn.disabled = false;
                isInitialOfferSent = false;
                if (pc) pc.close();
            };

            ws.onerror = () => {
                updateStatus("Signaling WebSocket error.", true);
                startBtn.disabled = false;
            };
        } catch (e) {
            console.error("Connection failed:", e);
            updateStatus(`WebRTC failed: ${e.message}`, true);
            startBtn.disabled = false;
            isInitialOfferSent = false;
        }
    }
</script>
