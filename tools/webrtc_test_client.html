<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mezon SFU — Meeting Room</title>
        <style>
            :root {
                --bg: #11111b;
                --panel: #1e1e2e;
                --tile: #181825;
                --border: #313244;
                --text: #cdd6f4;
                --muted: #a6adc8;
                --accent: #89b4fa;
                --accent-hover: #b4befe;
                --ok: #a6e3a1;
                --warn: #f9e2af;
                --err: #f38ba8;
                --speaking: #a6e3a1;
            }
            * {
                box-sizing: border-box;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                margin: 0;
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            /* ---------- pre-join screen ---------- */
            #joinScreen {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #joinCard {
                background: var(--panel);
                padding: 32px;
                border-radius: 16px;
                width: 380px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            }
            #joinCard h1 {
                font-size: 20px;
                margin: 0 0 4px;
            }
            #joinCard p.sub {
                color: var(--muted);
                font-size: 13px;
                margin: 0 0 20px;
            }
            .form-group {
                margin-bottom: 14px;
            }
            label {
                display: block;
                margin-bottom: 6px;
                font-size: 12px;
                color: var(--muted);
                font-weight: 600;
            }
            input {
                width: 100%;
                padding: 10px 12px;
                background: var(--tile);
                border: 1px solid var(--border);
                color: var(--text);
                border-radius: 8px;
                font-size: 14px;
            }
            input:focus {
                outline: none;
                border-color: var(--accent);
            }
            #joinPreview {
                width: 100%;
                aspect-ratio: 16/9;
                background: #000;
                border-radius: 10px;
                margin-bottom: 14px;
                object-fit: cover;
                transform: scaleX(-1);
            }
            button {
                background: var(--accent);
                color: #11111b;
                border: none;
                padding: 12px 20px;
                font-weight: 700;
                border-radius: 8px;
                cursor: pointer;
                width: 100%;
                font-size: 14px;
            }
            button:hover {
                background: var(--accent-hover);
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            #joinStatus {
                margin-top: 12px;
                font-size: 12px;
                color: var(--muted);
                text-align: center;
                min-height: 16px;
            }
            #joinStatus.err {
                color: var(--err);
            }

            /* ---------- meeting room ---------- */
            #meetingRoom {
                display: none;
                flex: 1;
                flex-direction: column;
                min-height: 0;
            }
            #topBar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 18px;
                background: var(--panel);
                border-bottom: 1px solid var(--border);
                font-size: 13px;
                color: var(--muted);
                flex-shrink: 0;
            }
            #topBar .room-label {
                color: var(--text);
                font-weight: 700;
            }
            #connState {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--muted);
            }
            .dot.ok {
                background: var(--ok);
            }
            .dot.warn {
                background: var(--warn);
            }
            .dot.err {
                background: var(--err);
            }

            #videoGrid {
                flex: 1;
                display: grid;
                gap: 12px;
                padding: 16px;
                overflow-y: auto;
                grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                align-content: start;
            }
            .tile {
                position: relative;
                background: var(--tile);
                border-radius: 12px;
                overflow: hidden;
                aspect-ratio: 16/9;
                border: 2px solid transparent;
                transition: border-color 0.15s;
            }
            .tile.speaking {
                border-color: var(--speaking);
            }
            .tile video {
                width: 100%;
                height: 100%;
                object-fit: cover;
                background: #000;
                display: block;
            }
            .tile.local video {
                transform: scaleX(-1);
            }
            .tile .avatar-fallback {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #313244, #181825);
                font-size: 40px;
                font-weight: 700;
                color: var(--muted);
            }
            .tile .name-label {
                position: absolute;
                left: 8px;
                bottom: 8px;
                background: rgba(17, 17, 27, 0.7);
                padding: 4px 10px;
                border-radius: 6px;
                font-size: 12px;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .tile .mic-icon {
                width: 14px;
                height: 14px;
                opacity: 0.9;
            }
            .tile .mic-icon.muted {
                color: var(--err);
            }
            .tile .mic-icon.live {
                color: var(--ok);
            }
            .tile .badges {
                position: absolute;
                top: 8px;
                right: 8px;
                display: flex;
                gap: 4px;
            }
            .tile .badge {
                background: rgba(17, 17, 27, 0.7);
                border-radius: 6px;
                padding: 3px 7px;
                font-size: 10px;
                color: var(--muted);
            }

            #controlBar {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 12px;
                padding: 14px;
                background: var(--panel);
                border-top: 1px solid var(--border);
                flex-shrink: 0;
            }
            .ctrl-btn {
                width: 46px;
                height: 46px;
                border-radius: 50%;
                border: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 18px;
                background: var(--tile);
                color: var(--text);
                flex: 0 0 auto;
            }
            .ctrl-btn:hover {
                background: var(--border);
            }
            .ctrl-btn.off {
                background: var(--err);
                color: #11111b;
            }
            .ctrl-btn.leave {
                background: var(--err);
                color: #11111b;
                width: auto;
                padding: 0 22px;
                border-radius: 23px;
                font-weight: 700;
                font-size: 13px;
            }
            .ctrl-btn.leave:hover {
                background: #eb6f92;
            }
            #participantCount {
                color: var(--muted);
                font-size: 12px;
                margin-right: 6px;
            }
        </style>
    </head>
    <body>
        <div id="joinScreen">
            <div id="joinCard">
                <h1>Mezon SFU</h1>
                <p class="sub">Meeting room test client</p>

                <video id="joinPreview" autoplay playsinline muted></video>

                <div class="form-group">
                    <label for="wsUrl">Signaling WebSocket URL</label>
                    <input
                        type="text"
                        id="wsUrl"
                        value="wss://test-sfu.nccsoft.vn/ws"
                    />
                </div>
                <div class="form-group">
                    <label for="roomId">Room ID</label>
                    <input type="text" id="roomId" value="101" />
                </div>
                <div class="form-group">
                    <label for="displayName">Your name</label>
                    <input type="text" id="displayName" value="Guest" />
                </div>

                <button id="joinBtn" onclick="connectAndJoin()">
                    Join meeting
                </button>
                <div id="joinStatus">Requesting camera/microphone…</div>
            </div>
        </div>

        <div id="meetingRoom">
            <div id="topBar">
                <div>
                    Room <span class="room-label" id="roomLabel"></span>
                    <span id="participantCount"></span>
                </div>
                <div id="connState">
                    <span class="dot" id="connDot"></span
                    ><span id="connText">connecting…</span>
                </div>
            </div>

            <div id="videoGrid"></div>

            <div id="controlBar">
                <button
                    class="ctrl-btn"
                    id="micBtn"
                    onclick="toggleMic()"
                    title="Toggle microphone"
                >
                    🎤
                </button>
                <button
                    class="ctrl-btn"
                    id="camBtn"
                    onclick="toggleCam()"
                    title="Toggle camera"
                >
                    📷
                </button>
                <button class="ctrl-btn leave" onclick="leaveMeeting()">
                    Leave
                </button>
            </div>
        </div>

        <script>

            let ws = null;
            let pc = null;
            let localStream = null;
            let localTracksAdded = false;
            let isNegotiating = false;
            let micEnabled = true;
            let camEnabled = true;
            let audioCtx = null;

            /* participantId -> { tile, videoEl, stream, analyser, rafHandle, hasVideo } */
            const participants = new Map();

            const joinPreview = document.getElementById("joinPreview");
            const joinStatus = document.getElementById("joinStatus");
            const joinBtn = document.getElementById("joinBtn");

            window.addEventListener("DOMContentLoaded", async () => {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: true,
                    });
                } catch (e) {
                    console.warn(
                        "Audio/Video access failed, trying audio-only fallback:",
                        e,
                    );
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia(
                            { video: false, audio: true },
                        );
                    } catch (err) {
                        console.warn(
                            "Audio access failed. Joining as receiver-only:",
                            err,
                        );
                        localStream = new MediaStream();
                    }
                }

                joinPreview.srcObject = localStream;

                const hasVideo = localStream.getVideoTracks().length > 0;
                const hasAudio = localStream.getAudioTracks().length > 0;
                if (hasVideo && hasAudio)
                    setJoinStatus("Camera and mic ready.");
                else if (hasAudio)
                    setJoinStatus("Mic ready (no camera found).");
                else
                    setJoinStatus(
                        "No media input found — joining as receiver-only.",
                        true,
                    );
            });

            function setJoinStatus(msg, isError = false) {
                joinStatus.textContent = msg;
                joinStatus.className = isError ? "err" : "";
            }

            function setConnState(text, level) {
                document.getElementById("connText").textContent = text;
                const dot = document.getElementById("connDot");
                dot.className = "dot" + (level ? " " + level : "");
            }

            function updateParticipantCount() {
                const n = participants.size; // includes local tile
                document.getElementById("participantCount").textContent =
                    `· ${n} participant${n === 1 ? "" : "s"}`;
            }

            function createTile(id, { isLocal, label }) {
                const tile = document.createElement("div");
                tile.className = "tile" + (isLocal ? " local" : "");
                tile.id = "tile-" + id;

                const video = document.createElement("video");
                video.autoplay = true;
                video.playsInline = true;
                if (isLocal) video.muted = true; // never echo your own mic back to yourself

                const avatar = document.createElement("div");
                avatar.className = "avatar-fallback";
                avatar.textContent = (label || "?").slice(0, 1).toUpperCase();
                avatar.style.display = "none";

                const nameLabel = document.createElement("div");
                nameLabel.className = "name-label";
                nameLabel.innerHTML = `<span class="mic-icon live">●</span><span class="name-text">${label}</span>`;

                const badges = document.createElement("div");
                badges.className = "badges";

                tile.append(video, avatar, nameLabel, badges);
                document.getElementById("videoGrid").appendChild(tile);

                return { tile, video, avatar, nameLabel, badges };
            }

            function removeTile(id) {
                const p = participants.get(id);
                if (!p) return;
                if (p.rafHandle) cancelAnimationFrame(p.rafHandle);
                p.tile.remove();
                participants.delete(id);
                updateParticipantCount();
            }

            function ensureParticipant(id, opts) {
                let p = participants.get(id);
                if (p) return p;

                const { tile, video, avatar, nameLabel } = createTile(id, opts);
                p = {
                    tile,
                    video,
                    avatar,
                    nameLabel,
                    stream: null,
                    hasVideo: false,
                    rafHandle: null,
                    analyser: null,
                };
                participants.set(id, p);
                updateParticipantCount();
                return p;
            }

            function setTileStream(p, stream, hasVideo) {
                p.stream = stream;
                p.hasVideo = hasVideo;
                p.video.srcObject = stream;
                p.video.style.display = hasVideo ? "block" : "none";
                p.avatar.style.display = hasVideo ? "none" : "flex";
                attachAudioMeter(p, stream);
            }

            function attachAudioMeter(p, stream) {
                const audioTrack = stream.getAudioTracks()[0];
                if (!audioTrack) return;

                if (!audioCtx) {
                    audioCtx = new (
                        window.AudioContext || window.webkitAudioContext
                    )();
                }
                if (p.rafHandle) cancelAnimationFrame(p.rafHandle);

                try {
                    const source = audioCtx.createMediaStreamSource(
                        new MediaStream([audioTrack]),
                    );
                    const analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256;
                    source.connect(analyser);
                    const data = new Uint8Array(analyser.frequencyBinCount);

                    const tick = () => {
                        analyser.getByteFrequencyData(data);
                        const avg =
                            data.reduce((a, b) => a + b, 0) / data.length;
                        p.tile.classList.toggle("speaking", avg > 12); // empirical threshold, not calibrated to any spec
                        p.rafHandle = requestAnimationFrame(tick);
                    };
                    tick();
                } catch (e) {
                    console.warn("Audio meter unavailable for a tile:", e);
                }
            }

            function toggleMic() {
                micEnabled = !micEnabled;
                localStream
                    .getAudioTracks()
                    .forEach((t) => (t.enabled = micEnabled));
                const btn = document.getElementById("micBtn");
                btn.textContent = micEnabled ? "🎤" : "🔇";
                btn.classList.toggle("off", !micEnabled);
                const local = participants.get("local");
                if (local) {
                    const icon = local.nameLabel.querySelector(".mic-icon");
                    icon.classList.toggle("live", micEnabled);
                    icon.classList.toggle("muted", !micEnabled);
                }
            }

            function toggleCam() {
                camEnabled = !camEnabled;
                localStream
                    .getVideoTracks()
                    .forEach((t) => (t.enabled = camEnabled));
                const btn = document.getElementById("camBtn");
                btn.textContent = camEnabled ? "📷" : "📵";
                btn.classList.toggle("off", !camEnabled);
                const local = participants.get("local");
                if (local)
                    setTileStream(
                        local,
                        localStream,
                        camEnabled && localStream.getVideoTracks().length > 0,
                    );
            }

            function leaveMeeting() {
                if (ws) {
                    ws.close();
                    ws = null;
                }
                if (pc) {
                    pc.close();
                    pc = null;
                }
                participants.forEach((_, id) => removeTile(id));
                document.getElementById("meetingRoom").style.display = "none";
                document.getElementById("joinScreen").style.display = "flex";
                joinBtn.disabled = false;
                localTracksAdded = false;
                isNegotiating = false;
            }

            // SVC + GCC support
            // NOTE: the SFU now offers VP9 (preferred), AV1, and VP8
            // (fallback) in that order. Browsers don't always default to
            // the offer's listed order when constructing an answer, so we
            // pin it explicitly here to make sure VP9 (the codec the SFU's
            // SVC layer-selection logic targets) actually gets chosen when
            // the local encoder supports it.
            //
            // IMPORTANT: none of this activates real congestion control by
            // itself. GCC bandwidth estimation only runs once the
            // transport-wide-cc RTP header extension is negotiated in SDP
            // -- that has to be offered server-side (not yet done as of
            // this client change) before any of this has an effect beyond
            // "which codec got picked". Treat this as client-side
            // groundwork, not confirmation that GCC is active end-to-end.

            function preferSvcVideoCodecs(transceiver) {
                if (
                    !transceiver ||
                    typeof transceiver.setCodecPreferences !== "function"
                ) {
                    console.warn(
                        "setCodecPreferences not supported in this browser -- codec order left to browser default",
                    );
                    return;
                }
                if (typeof RTCRtpSender.getCapabilities !== "function") {
                    console.warn(
                        "RTCRtpSender.getCapabilities not supported -- cannot reorder codecs",
                    );
                    return;
                }
                const caps = RTCRtpSender.getCapabilities("video");
                if (!caps || !caps.codecs) {
                    return;
                }

                const byName = (name) =>
                    caps.codecs.filter(
                        (c) => c.mimeType.toLowerCase() === `video/${name}`,
                    );
                const vp9 = byName("vp9");
                const av1 = byName("av1");
                const vp8 = byName("vp8");
                // Everything else (rtx, red, ulpfec, and any codec not in
                // our preferred set) -- order among these doesn't matter,
                // the browser matches rtx/red entries to their primary
                // codec via apt=/etc regardless of list position.
                const rest = caps.codecs.filter(
                    (c) =>
                        !vp9.includes(c) &&
                        !av1.includes(c) &&
                        !vp8.includes(c),
                );

                const ordered = [...vp9, ...av1, ...vp8, ...rest];
                try {
                    transceiver.setCodecPreferences(ordered);
                    console.log(
                        "Video codec preference set: VP9 > AV1 > VP8 (fallback)",
                    );
                } catch (e) {
                    console.warn(
                        "setCodecPreferences failed, leaving browser default order:",
                        e,
                    );
                }
            }

            async function enableSvcForVideoSender(pc, videoTrack) {
                // The video transceiver already exists at this point --
                // it was created when setRemoteDescription processed the
                // server's offer (mid 1, initially recvonly). We attach
                // our track to that existing transceiver rather than
                // creating a new one.
                const transceiver =
                    pc
                        .getTransceivers()
                        .find(
                            (t) =>
                                t.receiver &&
                                t.receiver.track &&
                                t.receiver.track.kind === "video",
                        ) ||
                    pc.getTransceivers().find((t) => t.mid === "1");

                if (!transceiver) {
                    console.warn(
                        "No video transceiver found to attach local track/SVC to -- falling back to plain addTrack",
                    );
                    pc.addTrack(videoTrack, localStream);
                    return;
                }

                preferSvcVideoCodecs(transceiver);

                await transceiver.sender.replaceTrack(videoTrack);
                if (transceiver.direction !== "sendrecv") {
                    transceiver.direction = "sendonly";
                }

                // Request 3 spatial x 3 temporal SVC layers, matching the
                // SFU's sid 0-2 / tid 0-2 layer-selection ladder. This only
                // takes effect if the negotiated codec ends up being VP9
                // or AV1 -- harmless no-op (single layer) on VP8 fallback.
                // Not all browsers support changing scalabilityMode via
                // setParameters after the transceiver/sender already
                // exists (some require it at addTransceiver time) --
                // failure here is non-fatal, audio/video still work,
                // just without SVC layering.
                try {
                    const params = transceiver.sender.getParameters();
                    params.encodings = [
                        {
                            scalabilityMode: "L3T3",
                            maxBitrate: 2_500_000,
                        },
                    ];
                    await transceiver.sender.setParameters(params);
                    console.log("SVC requested: scalabilityMode=L3T3");
                } catch (e) {
                    console.warn(
                        "Could not set SVC scalabilityMode (codec/browser may not support changing it post-creation) -- continuing without SVC layering:",
                        e,
                    );
                }
            }

            function startGccStatsMonitor(pc) {
                const interval = setInterval(async () => {
                    if (
                        pc.connectionState === "closed" ||
                        pc.connectionState === "failed"
                    ) {
                        clearInterval(interval);
                        return;
                    }
                    let stats;
                    try {
                        stats = await pc.getStats();
                    } catch (e) {
                        return;
                    }
                    stats.forEach((report) => {
                        if (
                            report.type === "outbound-rtp" &&
                            report.kind === "video"
                        ) {
                            console.log(
                                `[GCC] video out: target=${report.targetBitrate ? Math.round(report.targetBitrate / 1000) : "?"}kbps ` +
                                    `res=${report.frameWidth || "?"}x${report.frameHeight || "?"} ` +
                                    `fps=${report.framesPerSecond || "?"} ` +
                                    `scalabilityMode=${report.scalabilityMode || "n/a"} ` +
                                    `qualityLimitation=${report.qualityLimitationReason || "none"}`,
                            );
                        }
                        if (
                            report.type === "candidate-pair" &&
                            report.state === "succeeded" &&
                            report.availableOutgoingBitrate
                        ) {
                            console.log(
                                `[GCC] path estimate: availableOutgoingBitrate=${Math.round(report.availableOutgoingBitrate / 1000)}kbps`,
                            );
                        }
                    });
                }, 3000);
            }

            async function connectAndJoin() {
                const wsUrl = document.getElementById("wsUrl").value.trim();
                const roomId = document.getElementById("roomId").value.trim();
                const displayName =
                    document.getElementById("displayName").value.trim() ||
                    "Guest";

                if (!roomId) {
                    setJoinStatus("Please enter a Room ID", true);
                    return;
                }

                joinBtn.disabled = true;
                setJoinStatus("Preparing WebRTC connection…");

                try {
                    pc = new RTCPeerConnection({ iceServers: [] });
                    startGccStatsMonitor(pc);

                    pc.oniceconnectionstatechange = () => {
                        const s = pc.iceConnectionState;
                        if (s === "connected" || s === "completed")
                            setConnState("connected", "ok");
                        else if (s === "failed" || s === "disconnected")
                            setConnState(s, "err");
                        else setConnState(s, "warn");
                    };

                    pc.ontrack = (event) => {
                        const track = event.track;

                        console.log('--- ontrack event fired ---');
                        console.log('Track kind:', track.kind);
                        console.log('Track ID:', track.id);
                        console.log('Transceiver MID:', event.transceiver ? event.transceiver.mid : 'none');

                        if (track.kind === "video") {
                            // Use the stream's unique ID (which the backend set to the remote peer's ufrag)
                            // instead of track.id (which is hardcoded to "remote-video-track" for everyone)
                            const id =
                                event.streams && event.streams.length > 0
                                    ? event.streams[0].id
                                    : track.id;

                            // Generate a unique title based on the unique stream ID (e.g., "Peer brow")
                            const label = "Peer " + id.substring(0, 4);

                            const p = ensureParticipant(id, {
                                isLocal: false,
                                label: label,
                            });

                            // Wrap the single track in a brand new MediaStream so the <video> tag
                            // is forced to render this specific participant's video.
                            const singleVideoStream = new MediaStream([track]);
                            setTileStream(p, singleVideoStream, true);

                            track.addEventListener("ended", () => {
                                removeTile(id);
                            });

                            setConnState("connected", "ok");
                        } else if (track.kind === "audio") {
                            // Play incoming audio tracks independently in a hidden audio element.
                            // This ensures you hear everyone even if the SFU didn't group audio/video perfectly.
                            const audioEl = document.createElement("audio");
                            audioEl.autoplay = true;
                            audioEl.srcObject = new MediaStream([track]);
                            document.body.appendChild(audioEl);

                            track.addEventListener("ended", () => {
                                audioEl.remove();
                            });
                        }
                    };

                    // Local self-tile, shown immediately regardless of connection state.
                    const localTile = ensureParticipant("local", {
                        isLocal: true,
                        label: displayName + " (You)",
                    });
                    const hasLocalVideo =
                        localStream.getVideoTracks().length > 0;
                    setTileStream(localTile, localStream, hasLocalVideo);
                    if (!localStream.getAudioTracks().length) {
                        document.getElementById("micBtn").disabled = true;
                    }
                    if (!hasLocalVideo) {
                        document.getElementById("camBtn").disabled = true;
                    }

                    setJoinStatus("Connecting to signaling server…");
                    ws = new WebSocket(wsUrl);

                    ws.onopen = () => {
                        document.getElementById("joinScreen").style.display =
                            "none";
                        document.getElementById("meetingRoom").style.display =
                            "flex";
                        document.getElementById("roomLabel").textContent =
                            roomId;
                        setConnState("joining…", "warn");

                        ws.send(JSON.stringify({ type: "join", room: roomId }));
                    };

                    ws.onmessage = async (event) => {
                        const msg = JSON.parse(event.data);
                        console.log("Signaling received:", msg);

                        if (msg.type === "error") {
                            setConnState("error: " + msg.message, "err");
                            return;
                        }

                        if (msg.type === "joined") {
                            setConnState("awaiting offer…", "warn");
                            return;
                        }

                        if (msg.type === "offer") {
                            if (isNegotiating) {
                                console.log(
                                    "Offer received while already negotiating -- ignoring (a fresh one will follow if this was superseded).",
                                );
                                return;
                            }
                            isNegotiating = true;
                            try {
                                await pc.setRemoteDescription(
                                    new RTCSessionDescription({
                                        type: "offer",
                                        sdp: msg.sdp,
                                    }),
                                ).catch(e => console.error("setRemoteDescription failed:", e.name, e.message));

                                const activeTrackIds = new Set();
                                pc.getReceivers().forEach(r => {
                                    console.log('collect track state', r.track.readyState);
                                    if (r.track && r.track.readyState === "live") {
                                        activeTrackIds.add(r.track.id);
                                    }
                                });

                                for (const [id, p] of participants.entries()) {
                                    console.log('remove track', id, p);
                                    if (id === "local") continue;
                                    const track = p.stream ? p.stream.getTracks()[0] : null;
                                    if (!track || !activeTrackIds.has(track.id)) {
                                        removeTile(id);
                                    }
                                }

                                if (!localTracksAdded) {
                                    const audioTrack =
                                        localStream.getAudioTracks()[0];
                                    const videoTrack =
                                        localStream.getVideoTracks()[0];
                                    if (audioTrack)
                                        pc.addTrack(audioTrack, localStream);
                                    if (videoTrack)
                                        await enableSvcForVideoSender(
                                            pc,
                                            videoTrack,
                                        );
                                    localTracksAdded = true;
                                }

                                const answer = await pc.createAnswer();
                                await pc.setLocalDescription(answer);
                                ws.send(
                                    JSON.stringify({
                                        type: "answer",
                                        sdp: pc.localDescription.sdp,
                                    }),
                                );
                            } catch (err) {
                                console.error(
                                    "Failed to answer server-initiated offer:",
                                    err,
                                );
                                setConnState("negotiation failed", "err");
                            } finally {
                                isNegotiating = false;
                            }
                            return;
                        }

                        if (msg.type === "peer-left" && msg.streamId) {
                            // Speculative: not part of the protocol observed so far, but
                            // handled defensively in case the server ever sends it --
                            // harmless no-op if it never arrives.
                            removeTile(msg.streamId);
                        }
                    };

                    ws.onclose = () => {
                        setConnState("disconnected", "err");
                        localTracksAdded = false;
                        isNegotiating = false;
                    };
                    ws.onerror = () => {
                        setConnState("signaling error", "err");
                    };
                } catch (e) {
                    console.error("Connection failed:", e);
                    setJoinStatus(`WebRTC failed: ${e.message}`, true);
                    joinBtn.disabled = false;
                    localTracksAdded = false;
                    isNegotiating = false;
                }
            }
        </script>
    </body>
</html>
