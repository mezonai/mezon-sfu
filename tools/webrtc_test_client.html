<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mezon SFU Test Client</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1e1e2e;
            color: #cdd6f4;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .container {
            background: #313244;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #181825;
            border: 1px solid #45475a;
            color: #cdd6f4;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background: #89b4fa;
            color: #11111b;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #b4befe;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #45475a;
            font-family: monospace;
        }
        .video-container {
            margin-top: 20px;
        }
        video {
            width: 100%;
            max-height: 400px;
            background: #11111b;
            border-radius: 8px;
            transform: scaleX(-1); /* Mirror local video */
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Mezon SFU Client (Camera + Join)</h2>

    <div class="form-group">
        <label for="wsUrl">Signaling WebSocket URL</label>
        <input type="text" id="wsUrl" value="ws://127.0.0.1:8080">
    </div>

    <div class="form-group">
        <label for="roomId">Room ID</label>
        <input type="text" id="roomId" value="101">
    </div>

    <button id="startBtn" onclick="connectAndJoin()">Connect & Join Room</button>

    <div id="status">Status: Initializing Camera...</div>

    <div class="video-container">
        <label>Local Camera Feed</label>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>
</div>

<script>
    let ws = null;
    let pc = null;
    let localStream = null;

    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    // 1. Initialize the camera IMMEDIATELY on page load
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            updateStatus("Camera active. Ready to connect and join room.");
        } catch (e) {
            console.error("Camera access denied:", e);
            updateStatus("Error: Camera access denied. Please grant permissions and reload.", true);
            startBtn.disabled = true;
        }
    });

    function updateStatus(msg, isError = false) {
        statusDiv.innerText = `Status: ${msg}`;
        statusDiv.style.color = isError ? '#f38ba8' : '#a6e3a1';
    }

    // 2. Main connect action (Keeps your original media sequence intact)
    async function connectAndJoin() {
        const wsUrl = document.getElementById('wsUrl').value;
        const roomId = document.getElementById('roomId').value;

        if (!localStream) {
            updateStatus("Cannot join: Camera is not active.", true);
            return;
        }

        if (!roomId) {
            updateStatus("Please enter a Room ID", true);
            return;
        }

        startBtn.disabled = true;
        updateStatus("Preparing WebRTC local offer...");

        try {
            // Setup WebRTC PeerConnection exactly like the old way
            const config = { iceServers: [] };
            pc = new RTCPeerConnection(config);
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            updateStatus("Connecting to signaling server...");
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                updateStatus("Connected! Sending join and media offer...");

                // Send the JOIN message first
                const joinMsg = {
                    type: "join",
                    room: roomId
                };
                ws.send(JSON.stringify(joinMsg));

                setTimeout(() => {
                    const offerMsg = {
                        type: "offer",
                        sdp: pc.localDescription.sdp
                    };
                    ws.send(JSON.stringify(offerMsg));
                }, 100);
            };

            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                console.log("Signaling received:", msg);

                if (msg.type === "error") {
                    updateStatus(`Error: ${msg.message}`, true);
                    startBtn.disabled = false;
                    return;
                }

                // Handle the SDP Answer from the server
                if (msg.type === "answer") {
                    updateStatus("SDP Answer received. Media routing established!");
                    await pc.setRemoteDescription(new RTCSessionDescription({
                        type: 'answer',
                        sdp: msg.sdp
                    }));
                }
            };

            ws.onclose = () => {
                updateStatus("Signaling link disconnected.", true);
                startBtn.disabled = false;
                if (pc) pc.close();
            };

            ws.onerror = (err) => {
                updateStatus("Signaling WebSocket error.", true);
                startBtn.disabled = false;
            };

        } catch (e) {
            console.error("Connection failed:", e);
            updateStatus(`WebRTC failed: ${e.message}`, true);
            startBtn.disabled = false;
        }
    }
</script>
</body>
</html>
