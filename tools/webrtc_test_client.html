<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mezon SFU — VP9 SVC Test Client</title>
        <style>
            :root {
                --bg: #11111b;
                --panel: #1e1e2e;
                --tile: #181825;
                --border: #313244;
                --text: #cdd6f4;
                --muted: #a6adc8;
                --accent: #89b4fa;
                --accent-hover: #b4befe;
                --ok: #a6e3a1;
                --warn: #f9e2af;
                --err: #f38ba8;
                --speaking: #a6e3a1;
            }
            * {
                box-sizing: border-box;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                margin: 0;
                height: 100vh;
                height: 100dvh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            #joinScreen {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #joinCard {
                background: var(--panel);
                padding: 32px;
                border-radius: 16px;
                width: 380px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            }
            #joinCard h1 {
                font-size: 20px;
                margin: 0 0 4px;
            }
            #joinCard p.sub {
                color: var(--muted);
                font-size: 13px;
                margin: 0 0 20px;
            }
            .form-group {
                margin-bottom: 14px;
            }
            label {
                display: block;
                margin-bottom: 6px;
                font-size: 12px;
                color: var(--muted);
                font-weight: 600;
            }
            input, select {
                width: 100%;
                padding: 10px 12px;
                background: var(--tile);
                border: 1px solid var(--border);
                color: var(--text);
                border-radius: 8px;
                font-size: 14px;
            }
            input:focus, select:focus {
                outline: none;
                border-color: var(--accent);
            }
            #joinPreview {
                width: 100%;
                aspect-ratio: 16/9;
                background: #000;
                border-radius: 10px;
                margin-bottom: 14px;
                object-fit: cover;
                transform: scaleX(-1);
            }
            button {
                background: var(--accent);
                color: #11111b;
                border: none;
                padding: 12px 20px;
                font-weight: 700;
                border-radius: 8px;
                cursor: pointer;
                width: 100%;
                font-size: 14px;
            }
            button:hover {
                background: var(--accent-hover);
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            #joinStatus {
                margin-top: 12px;
                font-size: 12px;
                color: var(--muted);
                text-align: center;
                min-height: 16px;
            }
            #joinStatus.err {
                color: var(--err);
            }

            #meetingRoom {
                display: none;
                flex: 1;
                flex-direction: column;
                min-height: 0;
                height: 100%;
                overflow: hidden;
            }
            #topBar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 18px;
                background: var(--panel);
                border-bottom: 1px solid var(--border);
                font-size: 13px;
                color: var(--muted);
                flex-shrink: 0;
            }
            #topBar .room-label {
                color: var(--text);
                font-weight: 700;
            }
            #connState {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--muted);
            }
            .dot.ok {
                background: var(--ok);
            }
            .dot.warn {
                background: var(--warn);
            }
            .dot.err {
                background: var(--err);
            }

            #videoGrid {
                flex: 1;
                display: grid;
                gap: 12px;
                padding: 16px;
                overflow-y: auto;
                grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                align-content: start;
                -webkit-overflow-scrolling: touch;
            }
            .tile {
                position: relative;
                background: var(--tile);
                border-radius: 12px;
                overflow: hidden;
                aspect-ratio: 16/9;
                border: 2px solid transparent;
                transition: border-color 0.15s;
            }
            .tile.speaking {
                border-color: var(--speaking);
            }
            .tile video {
                width: 100%;
                height: 100%;
                object-fit: cover;
                background: #000;
                display: block;
            }
            .tile.local video {
                transform: scaleX(-1);
            }
            .tile .avatar-fallback {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #313244, #181825);
                font-size: 40px;
                font-weight: 700;
                color: var(--muted);
            }
            .tile .name-label {
                position: absolute;
                left: 8px;
                bottom: 8px;
                background: rgba(17, 17, 27, 0.7);
                padding: 4px 10px;
                border-radius: 6px;
                font-size: 12px;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .tile .mic-icon {
                width: 14px;
                height: 14px;
                opacity: 0.9;
            }
            .tile .mic-icon.muted {
                color: var(--err);
            }
            .tile .mic-icon.live {
                color: var(--ok);
            }
            .tile .badges {
                position: absolute;
                top: 8px;
                right: 8px;
                display: flex;
                gap: 4px;
            }
            .tile .badge {
                background: rgba(17, 17, 27, 0.75);
                border-radius: 6px;
                padding: 3px 7px;
                font-size: 10px;
                color: var(--accent);
                font-weight: 600;
            }

            #controlBar {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 12px;
                padding: 14px;
                background: var(--panel);
                border-top: 1px solid var(--border);
                flex-shrink: 0;
                z-index: 20;
            }
            .ctrl-btn {
                width: 46px;
                height: 46px;
                border-radius: 50%;
                border: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 18px;
                background: var(--tile);
                color: var(--text);
                flex: 0 0 auto;
            }
            .ctrl-btn:hover {
                background: var(--border);
            }
            .ctrl-btn.off {
                background: var(--err);
                color: #11111b;
            }
            .ctrl-btn.leave {
                background: var(--err);
                color: #11111b;
                width: auto;
                padding: 0 22px;
                border-radius: 23px;
                font-weight: 700;
                font-size: 13px;
            }
            .ctrl-btn.leave:hover {
                background: #eb6f92;
            }
            #participantCount {
                color: var(--muted);
                font-size: 12px;
                margin-right: 6px;
            }
            .join-btn-group {
                display: flex;
                position: relative;
                width: 100%;
            }
            .join-btn-group button {
                margin: 0;
            }
            #joinBtn {
                border-top-right-radius: 0;
                border-bottom-right-radius: 0;
                flex: 1;
            }
            #joinDropdownBtn {
                border-top-left-radius: 0;
                border-bottom-left-radius: 0;
                width: 44px;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                border-left: 1px solid rgba(17, 17, 27, 0.3);
            }
            .dropdown-menu {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 8px;
                margin-top: 6px;
                z-index: 10;
                overflow: hidden;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            }
            .dropdown-menu.show {
                display: block;
            }
            .dropdown-item {
                padding: 12px 16px;
                font-size: 14px;
                cursor: pointer;
                color: var(--text);
                font-weight: 600;
            }
            .dropdown-item:hover {
                background: var(--tile);
                color: var(--accent);
            }
        </style>
    </head>
    <body>
        <div id="joinScreen">
            <div id="joinCard">
                <h1>Mezon SFU</h1>
                <p class="sub">VP9 / SVC Test Client</p>

                <video id="joinPreview" autoplay playsinline muted></video>

                <div class="form-group">
                    <label for="wsUrl">Signaling WebSocket URL</label>
                    <input
                        type="text"
                        id="wsUrl"
                        value="wss://test-sfu.nccsoft.vn/ws"
                    />
                </div>
                <div class="form-group">
                    <label for="roomId">Room ID</label>
                    <input type="text" id="roomId" value="101" />
                </div>
                <div class="form-group">
                    <label for="displayName">Your name</label>
                    <input type="text" id="displayName" value="Guest" />
                </div>
                <div class="form-group">
                    <label for="videoCodec">Video Codec</label>
                    <select id="videoCodec">
                        <option value="VP9" selected>VP9 (SVC capable)</option>
                        <option value="VP8">VP8 (no SVC)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="svcMode">SVC Scalability Mode</label>
                    <select id="svcMode">
                        <option value="L3T3" selected>L3T3 (3 Spatial, 3 Temporal)</option>
                        <option value="L3T3_KEY">L3T3_KEY (3 Spatial, Keyframe-based)</option>
                        <option value="L2T2">L2T2 (2 Spatial, 2 Temporal)</option>
                        <option value="L1T3">L1T3 (1 Spatial, 3 Temporal)</option>
                        <option value="L1T2">L1T2 (1 Spatial, 2 Temporal)</option>
                        <option value="none">Disabled (single stream)</option>
                    </select>
                    <small style="color: var(--muted); display:block; margin-top:4px;">
                        SVC modes only apply to VP9. VP8 always uses a single stream.
                    </small>
                </div>

                <div class="join-btn-group">
                    <button id="joinBtn" onclick="connectAndJoin()">Join as speaker</button>
                    <button id="joinDropdownBtn" onclick="toggleJoinOptions(event)" title="Choose join mode">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div id="joinDropdownMenu" class="dropdown-menu">
                        <div class="dropdown-item" onclick="selectJoinMode('speaker')">Join as speaker</div>
                        <div class="dropdown-item" onclick="selectJoinMode('audience')">Join as audience</div>
                    </div>
                </div>
                <div id="joinStatus">Requesting camera/microphone…</div>
            </div>
        </div>

        <div id="meetingRoom">
            <div id="topBar">
                <div>
                    Room <span class="room-label" id="roomLabel"></span>
                    <span id="participantCount"></span>
                </div>
                <div id="connState">
                    <span class="dot" id="connDot"></span
                    ><span id="connText">connecting…</span>
                </div>
            </div>

            <div id="videoGrid"></div>

            <div id="controlBar">
                <button
                    class="ctrl-btn"
                    id="micBtn"
                    onclick="toggleMic()"
                    title="Toggle microphone"
                >
                    🎤
                </button>
                <button
                    class="ctrl-btn"
                    id="camBtn"
                    onclick="toggleCam()"
                    title="Toggle camera"
                >
                    📷
                </button>
                <button
                    class="ctrl-btn"
                    id="raiseHandBtn"
                    onclick="raiseHand()"
                    title="Raise hand to become a speaker"
                    style="display: none;"
                >
                    ✋
                </button>
                <button class="ctrl-btn leave" onclick="leaveMeeting()">
                    Leave
                </button>
            </div>
        </div>

        <script>
            let ws = null;
            let pc = null;
            let localStream = null;
            let localTracksAdded = false;
            let isNegotiating = false;
            let micEnabled = true;
            let camEnabled = true;
            let audioCtx = null;

            const participants = new Map();

            const joinPreview = document.getElementById("joinPreview");
            const joinStatus = document.getElementById("joinStatus");
            const joinBtn = document.getElementById("joinBtn");

            let currentJoinMode = 'speaker';

            function toggleJoinOptions(event) {
                event.stopPropagation();
                document.getElementById('joinDropdownMenu').classList.toggle('show');
            }

            function selectJoinMode(mode) {
                currentJoinMode = mode;
                document.getElementById('joinBtn').textContent = mode === 'speaker' ? 'Join as speaker' : 'Join as audience';
                document.getElementById('joinDropdownMenu').classList.remove('show');
            }

            // Close the dropdown if the user clicks anywhere else on the page
            document.addEventListener('click', () => {
                const menu = document.getElementById('joinDropdownMenu');
                if (menu && menu.classList.contains('show')) {
                    menu.classList.remove('show');
                }
            });

            window.addEventListener("DOMContentLoaded", async () => {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: true,
                    });
                } catch (e) {
                    console.warn(
                        "Audio/Video access failed, trying audio-only fallback:",
                        e,
                    );
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia(
                            { video: false, audio: true },
                        );
                    } catch (err) {
                        console.warn(
                            "Audio access failed. Joining as receiver-only:",
                            err,
                        );
                        localStream = new MediaStream();
                    }
                }

                joinPreview.srcObject = localStream;

                const hasVideo = localStream.getVideoTracks().length > 0;
                const hasAudio = localStream.getAudioTracks().length > 0;
                if (hasVideo && hasAudio)
                    setJoinStatus("Camera and mic ready.");
                else if (hasAudio)
                    setJoinStatus("Mic ready (no camera found).");
                else
                    setJoinStatus(
                        "No media input found — joining as receiver-only.",
                        true,
                    );
            });

            function setJoinStatus(msg, isError = false) {
                joinStatus.textContent = msg;
                joinStatus.className = isError ? "err" : "";
            }

            function setConnState(text, level) {
                document.getElementById("connText").textContent = text;
                const dot = document.getElementById("connDot");
                dot.className = "dot" + (level ? " " + level : "");
            }

            function updateParticipantCount() {
                const n = participants.size;
                document.getElementById("participantCount").textContent =
                    `· ${n} participant${n === 1 ? "" : "s"}`;
            }

            function createTile(id, { isLocal, label }) {
                const tile = document.createElement("div");
                tile.className = "tile" + (isLocal ? " local" : "");
                tile.id = "tile-" + id;

                const video = document.createElement("video");
                video.autoplay = true;
                video.playsInline = true;
                if (isLocal) video.muted = true;

                const avatar = document.createElement("div");
                avatar.className = "avatar-fallback";
                avatar.textContent = (label || "?").slice(0, 1).toUpperCase();
                avatar.style.display = "none";

                const nameLabel = document.createElement("div");
                nameLabel.className = "name-label";
                nameLabel.innerHTML = `<span class="mic-icon live">●</span><span class="name-text">${label}</span>`;

                const badges = document.createElement("div");
                badges.className = "badges";

                tile.append(video, avatar, nameLabel, badges);
                document.getElementById("videoGrid").appendChild(tile);

                return { tile, video, avatar, nameLabel, badges };
            }

            function removeTile(id) {
                const p = participants.get(id);
                if (!p) return;
                if (p.rafHandle) cancelAnimationFrame(p.rafHandle);
                p.tile.remove();
                participants.delete(id);
                updateParticipantCount();
            }

            function ensureParticipant(id, opts) {
                let p = participants.get(id);
                if (p) return p;

                const { tile, video, avatar, nameLabel, badges } = createTile(id, opts);
                p = {
                    tile,
                    video,
                    avatar,
                    nameLabel,
                    badges,
                    stream: null,
                    hasVideo: false,
                    rafHandle: null,
                    analyser: null,
                };
                participants.set(id, p);
                updateParticipantCount();
                return p;
            }

            function setTileStream(p, stream, hasVideo) {
                p.stream = stream;
                p.hasVideo = hasVideo;
                p.video.srcObject = stream;

                const videoTrack = hasVideo ? stream.getVideoTracks()[0] : null;
                const showVideo = () => {
                    const live = hasVideo && videoTrack && !videoTrack.muted && videoTrack.readyState === "live";
                    p.video.style.display = live ? "block" : "none";
                    p.avatar.style.display = live ? "none" : "flex";
                };
                if (videoTrack) {
                    // The SFU marks a demoted publisher's m-line inactive instead
                    // of removing it, so the receiver track mutes (black frame)
                    // rather than ending. Hide the video while muted so the tile
                    // falls back to the avatar instead of a black placeholder.
                    videoTrack.addEventListener("mute", showVideo);
                    videoTrack.addEventListener("unmute", showVideo);
                    videoTrack.addEventListener("ended", showVideo);
                }
                showVideo();

                attachAudioMeter(p, stream);
            }

            function attachAudioMeter(p, stream) {
                const audioTrack = stream.getAudioTracks()[0];
                if (!audioTrack) return;

                if (!audioCtx) {
                    audioCtx = new (
                        window.AudioContext || window.webkitAudioContext
                    )();
                }
                if (p.rafHandle) cancelAnimationFrame(p.rafHandle);

                try {
                    const source = audioCtx.createMediaStreamSource(
                        new MediaStream([audioTrack]),
                    );
                    const analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256;
                    source.connect(analyser);
                    const data = new Uint8Array(analyser.frequencyBinCount);

                    const tick = () => {
                        analyser.getByteFrequencyData(data);
                        const avg =
                            data.reduce((a, b) => a + b, 0) / data.length;
                        p.tile.classList.toggle("speaking", avg > 12);
                        p.rafHandle = requestAnimationFrame(tick);
                    };
                    tick();
                } catch (e) {
                    console.warn("Audio meter unavailable for a tile:", e);
                }
            }

            function toggleMic() {
                micEnabled = !micEnabled;
                localStream
                    .getAudioTracks()
                    .forEach((t) => (t.enabled = micEnabled));
                const btn = document.getElementById("micBtn");
                btn.textContent = micEnabled ? "🎤" : "🔇";
                btn.classList.toggle("off", !micEnabled);
                const local = participants.get("local");
                if (local) {
                    const icon = local.nameLabel.querySelector(".mic-icon");
                    icon.classList.toggle("live", micEnabled);
                    icon.classList.toggle("muted", !micEnabled);
                }
            }

            function toggleCam() {
                camEnabled = !camEnabled;
                localStream
                    .getVideoTracks()
                    .forEach((t) => (t.enabled = camEnabled));
                const btn = document.getElementById("camBtn");
                btn.textContent = camEnabled ? "📷" : "📵";
                btn.classList.toggle("off", !camEnabled);
                const local = participants.get("local");
                if (local)
                    setTileStream(
                        local,
                        localStream,
                        camEnabled && localStream.getVideoTracks().length > 0,
                    );
            }

            function leaveMeeting() {
                handRaised = false;
                if (ws) {
                    ws.close();
                    ws = null;
                }
                if (pc) {
                    pc.close();
                    pc = null;
                }
                participants.forEach((_, id) => removeTile(id));
                document.getElementById("meetingRoom").style.display = "none";
                document.getElementById("joinScreen").style.display = "flex";
                joinBtn.disabled = false;
                localTracksAdded = false;
                isNegotiating = false;
                const raiseBtn = document.getElementById("raiseHandBtn");
                if (raiseBtn) {
                    raiseBtn.style.display = "none";
                    raiseBtn.style.background = "var(--tile)";
                    raiseBtn.style.color = "var(--text)";
                }
            }

            /* Force preferred video codec via setCodecPreferences */
            function forceVideoCodec(transceiver, codecName) {
                if (
                    !transceiver ||
                    typeof transceiver.setCodecPreferences !== "function"
                ) {
                    console.warn("setCodecPreferences not supported in this browser.");
                    return;
                }
                if (typeof RTCRtpSender.getCapabilities !== "function") {
                    console.warn("RTCRtpSender.getCapabilities not supported.");
                    return;
                }
                const caps = RTCRtpSender.getCapabilities("video");
                if (!caps || !caps.codecs) return;

                const wanted = (codecName || "VP9").toLowerCase();
                const preferred = caps.codecs.filter(
                    (c) => c.mimeType.toLowerCase() === "video/" + wanted
                );
                const rtx = caps.codecs.filter(
                    (c) => c.mimeType.toLowerCase() === "video/rtx"
                );

                if (preferred.length > 0) {
                    try {
                        // Prefer selected codec first; keep RTX so NACK recovery works.
                        transceiver.setCodecPreferences([...preferred, ...rtx]);
                        console.log("Forced video codec preference:", wanted, preferred);
                    } catch (e) {
                        console.warn("setCodecPreferences for " + wanted + " failed:", e);
                    }
                } else {
                    console.warn(wanted.toUpperCase() + " codec is not supported by this browser.");
                }
            }

            /* Configure video transceiver: codec preference + optional VP9 SVC mode */
            async function enableSvcForVideoSender(pc, videoTrack) {
                const selectedMode = document.getElementById("svcMode").value;
                const selectedCodec = (document.getElementById("videoCodec") || {}).value || "VP9";

                const transceiver =
                    pc.getTransceivers().find(
                        (t) =>
                            t.mid === "1" ||
                            (t.sender && t.sender.track && t.sender.track.kind === "video") ||
                            (t.receiver && t.receiver.track && t.receiver.track.kind === "video" &&
                             (t.direction === "sendonly" || t.direction === "sendrecv" || t.direction === "inactive"))
                    );

                if (!transceiver) {
                    console.warn("No video transceiver found to attach track/SVC to -- falling back to plain addTrack");
                    pc.addTrack(videoTrack, localStream);
                    return;
                }

                // Prefer the uplink mid:1 transceiver when present.
                const uplink =
                    pc.getTransceivers().find((t) => t.mid === "1") || transceiver;

                forceVideoCodec(uplink, selectedCodec);

                await uplink.sender.replaceTrack(videoTrack);
                if (uplink.direction !== "sendrecv" && uplink.direction !== "sendonly") {
                    uplink.direction = "sendonly";
                }

                // SVC only applies to VP9. Always clear scalabilityMode for VP8 or
                // when the user selects Disabled so the encoder cannot keep a
                // previously negotiated multi-layer mode after renegotiation.
                const wantSvc = selectedCodec === "VP9" && selectedMode !== "none";
                try {
                    const params = uplink.sender.getParameters();
                    if (!params.encodings || params.encodings.length === 0) {
                        params.encodings = [{}];
                    }
                    if (wantSvc) {
                        params.encodings[0].scalabilityMode = selectedMode;
                        // L3T3 needs headroom for three spatial layers. minBitrate
                        // keeps Chrome from parking the encoder at ~30–150 kbps when
                        // send-side BWE is still probing; maxBitrate is the hard cap.
                        params.encodings[0].minBitrate = 600_000;
                        params.encodings[0].maxBitrate = 2_500_000;
                        params.encodings[0].maxFramerate = 30;
                    } else {
                        // Explicitly clear any leftover SVC mode.
                        if ("scalabilityMode" in params.encodings[0]) {
                            delete params.encodings[0].scalabilityMode;
                        }
                        params.encodings[0].minBitrate = 400_000;
                        params.encodings[0].maxBitrate = 1_500_000;
                        params.encodings[0].maxFramerate = 30;
                    }

                    await uplink.sender.setParameters(params);

                    const effective = uplink.sender.getParameters();
                    const applied = effective.encodings && effective.encodings[0]
                        ? effective.encodings[0].scalabilityMode
                        : undefined;
                    const enc0 = effective.encodings && effective.encodings[0] ? effective.encodings[0] : {};
                    console.log(
                        `Video sender: codec=${selectedCodec}, SVC requested=${wantSvc ? selectedMode : "none"}, ` +
                            `encoder reports scalabilityMode=${applied || "NONE"}, ` +
                            `minBitrate=${enc0.minBitrate || "?"} maxBitrate=${enc0.maxBitrate || "?"}, ` +
                            `encodings=${effective.encodings ? effective.encodings.length : 0}`
                    );
                    if (wantSvc && !applied) {
                        const isFirefox = navigator.userAgent.includes("Firefox");
                        console.warn(
                            `SVC mode ${selectedMode} was NOT applied by the encoder. ` +
                                (isFirefox
                                    ? "Firefox does not implement scalabilityMode in setParameters -- " +
                                      "SVC only works in Chrome/Chromium. Test there to see layers."
                                    : "The VP9 encoder refused the scalability mode. " +
                                      "Try a lighter mode (e.g. L1T3) or lower the capture resolution. " +
                                      "Or switch Video Codec to VP8 / SVC Disabled for a single stream.")
                        );
                    }
                } catch (e) {
                    console.warn(
                        `Could not configure video sender (codec=${selectedCodec}, mode=${selectedMode}):`,
                        e
                    );
                }
            }

            function startGccStatsMonitor(pc) {
                const interval = setInterval(async () => {
                    if (
                        pc.connectionState === "closed" ||
                        pc.connectionState === "failed"
                    ) {
                        clearInterval(interval);
                        return;
                    }
                    let stats;
                    try {
                        stats = await pc.getStats();
                    } catch (e) {
                        return;
                    }

                    // Index codec reports so we can resolve outbound-rtp.codecId
                    // to the negotiated mimeType (VP8/VP9/AV1/H264...). This is
                    // what tells us whether the VP9 preference actually won and
                    // SVC could engage.
                    const codecsById = new Map();
                    let availableOutKbps = null;
                    stats.forEach((report) => {
                        if (report.type === "codec") {
                            codecsById.set(report.id, report);
                        }
                        if (
                            report.type === "candidate-pair" &&
                            report.state === "succeeded" &&
                            report.availableOutgoingBitrate
                        ) {
                            availableOutKbps = Math.round(report.availableOutgoingBitrate / 1000);
                        }
                    });

                    stats.forEach((report) => {
                        if (
                            report.type === "outbound-rtp" &&
                            report.kind === "video"
                        ) {
                            const mode = report.scalabilityMode || "N/A";
                            const res = `${report.frameWidth || 0}x${report.frameHeight || 0}`;
                            const fps = report.framesPerSecond || 0;
                            const kbps = report.targetBitrate ? Math.round(report.targetBitrate / 1000) : "?";

                            // Debug: negotiated codec + encoder implementation.
                            // RTX reports have no framesPerSecond, so fps>0
                            // identifies the real media stream vs the RTX stream.
                            const codec = report.codecId ? codecsById.get(report.codecId) : null;
                            const codecName = codec ? codec.mimeType.split("/")[1] : "unknown";
                            const encoder = report.encoderImplementation || "unknown";
                            const isRtx = !report.framesPerSecond && !report.frameWidth ? " [RTX stream]" : "";

                            console.log(
                                `[VP9 SVC] Outbound: codec=${codecName} encoder=${encoder} ` +
                                    `target=${kbps}kbps availableOut=${availableOutKbps != null ? availableOutKbps + "kbps" : "?"} ` +
                                    `res=${res} fps=${fps} ` +
                                    `scalabilityMode=${mode} ` +
                                    `qualityLimitation=${report.qualityLimitationReason || "none"}${isRtx}`
                            );

                            // Update live overlay badge on local tile (skip RTX reports)
                            if (isRtx) return;
                            const localTile = participants.get("local");
                            if (localTile && localTile.badges) {
                                localTile.badges.innerHTML = `
                                    <span class="badge">${codecName}</span>
                                    <span class="badge">${mode}</span>
                                    <span class="badge">${res} @ ${fps}fps</span>
                                `;
                            }
                        }
                    });
                }, 2000);
            }

            let handRaised = false;

            function raiseHand() {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;

                handRaised = !handRaised;

                ws.send(JSON.stringify({
                    type: handRaised ? "raise_hand" : "role_change",
                    role: handRaised ? "speaker" : "audience",
                }));

                const btn = document.getElementById("raiseHandBtn");
                if (handRaised) {
                    btn.style.background = "var(--warn)";
                    btn.style.color = "#11111b";
                } else {
                    btn.style.background = "var(--tile)";
                    btn.style.color = "var(--text)";
                }
            }

            async function connectAndJoin() {
                let wsUrl = document.getElementById("wsUrl").value.trim();
                const roomId = document.getElementById("roomId").value.trim();
                const displayName =
                    document.getElementById("displayName").value.trim() ||
                    "Guest";

                if (!roomId) {
                    setJoinStatus("Please enter a Room ID", true);
                    return;
                }

                // Browsers block ws:// from https:// pages (mixed content). Prefer wss.
                if (location.protocol === "https:" && wsUrl.startsWith("ws://")) {
                    const upgraded = "wss://" + wsUrl.slice("ws://".length);
                    console.warn(`Upgrading insecure WebSocket URL to ${upgraded} (page is HTTPS)`);
                    wsUrl = upgraded;
                    document.getElementById("wsUrl").value = wsUrl;
                }

                joinBtn.disabled = true;
                setJoinStatus("Preparing WebRTC connection…");

                try {
                    pc = new RTCPeerConnection({ iceServers: [] });
                    startGccStatsMonitor(pc);

                    pc.oniceconnectionstatechange = () => {
                        const s = pc.iceConnectionState;
                        if (s === "connected" || s === "completed")
                            setConnState("connected", "ok");
                        else if (s === "failed" || s === "disconnected")
                            setConnState(s, "err");
                        else setConnState(s, "warn");
                    };

                    pc.ontrack = (event) => {
                        const track = event.track;

                        console.log('ontrack event fired', track.kind, track.id);

                        // Key remote tiles by transceiver mid: the SFU reuses the
                        // same msid/stream id when a demoted peer is re-promoted
                        // with new tracks, so stream id alone cannot tell peers
                        // (or incarnations of the same peer) apart.
                        const id = event.transceiver && event.transceiver.mid
                            ? "mid-" + event.transceiver.mid
                            : (event.streams && event.streams.length > 0
                                ? event.streams[0].id
                                : track.id);

                        if (track.kind === "video") {
                            const label = "Peer " + id.substring(0, 8);
                            const p = ensureParticipant(id, {
                                isLocal: false,
                                label: label,
                            });

                            const singleVideoStream = new MediaStream([track]);
                            setTileStream(p, singleVideoStream, true);

                            track.addEventListener("ended", () => {
                                removeTile(id);
                            });

                            setConnState("connected", "ok");
                        } else if (track.kind === "audio") {
                            const audioEl = document.createElement("audio");
                            audioEl.autoplay = true;
                            audioEl.srcObject = new MediaStream([track]);
                            audioEl.dataset.owner = id;
                            document.body.appendChild(audioEl);

                            track.addEventListener("ended", () => {
                                audioEl.remove();
                            });
                        }
                    };

                    if (currentJoinMode === 'speaker') {
                        const localTile = ensureParticipant("local", {
                            isLocal: true,
                            label: displayName + " (You)",
                        });
                        const hasLocalVideo = localStream.getVideoTracks().length > 0;
                        setTileStream(localTile, localStream, hasLocalVideo);

                        document.getElementById("micBtn").style.display = "flex";
                        document.getElementById("camBtn").style.display = "flex";
                        document.getElementById("raiseHandBtn").style.display = "none";

                        if (!localStream.getAudioTracks().length) {
                            document.getElementById("micBtn").disabled = true;
                        }
                        if (!hasLocalVideo) {
                            document.getElementById("camBtn").disabled = true;
                        }
                    } else {
                        // Hide mic/cam controls for audience
                        document.getElementById("micBtn").style.display = "none";
                        document.getElementById("camBtn").style.display = "none";
                        document.getElementById("raiseHandBtn").style.display = "flex";
                    }

                    setJoinStatus("Connecting to signaling server…");
                    ws = new WebSocket(wsUrl);

                    ws.onopen = () => {
                        document.getElementById("joinScreen").style.display = "none";
                        document.getElementById("meetingRoom").style.display = "flex";
                        document.getElementById("roomLabel").textContent = roomId;
                        setConnState("joining…", "warn");

                        // Pass the selected role (speaker or audience) to the SFU
                        ws.send(JSON.stringify({
                            type: "join",
                            room: roomId,
                            role: currentJoinMode,
                        }));
                    };

                    ws.onmessage = async (event) => {
                        const msg = JSON.parse(event.data);
                        console.log("Signaling received:", msg);

                        if (msg.type === "error") {
                            setConnState("error: " + msg.message, "err");
                            return;
                        }

                        if (msg.type === "joined") {
                            setConnState("awaiting offer…", "warn");
                            return;
                        }

                        if (msg.type === "role_changed" && msg.role === "speaker") {
                            // Attach the pre-captured local tracks to the existing
                            // transceivers and switch them to send-only. addTrack()
                            // alone cannot make a recvonly transceiver send, so we
                            // replaceTrack + set direction on the audio/video senders.
                            try {
                                const audioTrack = localStream.getAudioTracks()[0];
                                const videoTrack = localStream.getVideoTracks()[0];

                                const audioTc = pc.getTransceivers().find(t => t.receiver && t.receiver.track && t.receiver.track.kind === "audio");
                                const videoTc = pc.getTransceivers().find(t => t.receiver && t.receiver.track && t.receiver.track.kind === "video");

                                if (audioTc && audioTrack) {
                                    await audioTc.sender.replaceTrack(audioTrack);
                                    audioTc.direction = "sendonly";
                                } else if (audioTrack) {
                                    pc.addTrack(audioTrack, localStream);
                                }

                                if (videoTc && videoTrack) {
                                    await videoTc.sender.replaceTrack(videoTrack);
                                    videoTc.direction = "sendonly";
                                } else if (videoTrack) {
                                    await enableSvcForVideoSender(pc, videoTrack);
                                }
                                localTracksAdded = true;
                            } catch (e) {
                                console.error("Failed to attach tracks on promotion:", e);
                            }
                            return;
                        }

                        if (msg.type === "role_changed" && msg.role === "audience") {
                            // Demoted: stop sending by detaching our tracks from the
                            // senders. The next server offer will mark them inactive.
                            try {
                                pc.getSenders().forEach(s => {
                                    if (s.track) s.replaceTrack(null);
                                });
                                localTracksAdded = false;
                            } catch (e) {
                                console.error("Failed to detach tracks on demotion:", e);
                            }
                            return;
                        }

                        if (msg.type === "offer") {
                            if (isNegotiating) {
                                console.log("Offer received while already negotiating -- ignoring.");
                                return;
                            }
                            isNegotiating = true;
                            try {
                                await pc.setRemoteDescription(
                                    new RTCSessionDescription({
                                        type: "offer",
                                        sdp: msg.sdp,
                                    }),
                                ).catch(e => console.error("setRemoteDescription failed:", e.name, e.message));

                                if (!localTracksAdded && currentJoinMode === 'speaker') {
                                    const audioTrack = localStream.getAudioTracks()[0];
                                    const videoTrack = localStream.getVideoTracks()[0];
                                    if (audioTrack) pc.addTrack(audioTrack, localStream);
                                    if (videoTrack) await enableSvcForVideoSender(pc, videoTrack);
                                    localTracksAdded = true;
                                }

                                const answer = await pc.createAnswer();
                                await pc.setLocalDescription(answer);

                                // Prune tiles whose peer left the room entirely.
                                // The SFU never removes m-lines: when a peer leaves,
                                // its mids stay in the offer but become a=inactive
                                // with no a=ssrc lines (the snapshot entry is dropped
                                // by room_remove_peer -> snapshot_build_without, and
                                // sfu_sdp_build_offer only emits a=ssrc for live
                                // entries). A camera-off speaker keeps their m-line
                                // a=sendonly, so their tile survives and the track
                                // mute listener swaps it to the avatar fallback.
                                const deadMids = new Set();
                                for (const m of msg.sdp.split(/^m=/m).slice(1)) {
                                    const midMatch = m.match(/^a=mid:(\S+)\s*$/m);
                                    if (!midMatch) continue;
                                    const mid = midMatch[1];
                                    if (!/^\d+$/.test(mid)) continue; // skip local m-lines (mid 0/1)
                                    const hasSsrc = /^a=ssrc:/m.test(m) || /^a=msid:\S+ \S+\s*$/m.test(m);
                                    const isInactive = /^a=inactive\s*$/m.test(m);
                                    if (isInactive && !hasSsrc) {
                                        deadMids.add(mid);
                                    }
                                }

                                for (const [id, p] of participants.entries()) {
                                    if (id === "local") continue;
                                    if (id.startsWith("mid-") && deadMids.has(id.slice(4))) {
                                        removeTile(id);
                                    }
                                }
                                // Also drop audio elements belonging to departed peers.
                                document.querySelectorAll("audio[data-owner]").forEach(el => {
                                    const owner = el.dataset.owner;
                                    if (owner.startsWith("mid-") && deadMids.has(owner.slice(4))) {
                                        el.remove();
                                    }
                                });

                                ws.send(
                                    JSON.stringify({
                                        type: "answer",
                                        sdp: pc.localDescription.sdp,
                                    }),
                                );
                            } catch (err) {
                                console.error("Failed to answer server-initiated offer:", err);
                                setConnState("negotiation failed", "err");
                            } finally {
                                isNegotiating = false;
                            }
                            return;
                        }
                    };

                    ws.onclose = () => {
                        setConnState("disconnected", "err");
                        localTracksAdded = false;
                        isNegotiating = false;
                    };
                    ws.onerror = () => {
                        setConnState("signaling error", "err");
                    };
                } catch (e) {
                    console.error("Connection failed:", e);
                    setJoinStatus(`WebRTC failed: ${e.message}`, true);
                    joinBtn.disabled = false;
                    localTracksAdded = false;
                    isNegotiating = false;
                }
            }
        </script>
    </body>
</html>
