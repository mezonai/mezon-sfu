[server]
log_level = 1
media_port = 7000
signaling_port = 8000
public_host = 127.0.0.1
jwt_secret = default

[nats]
nats_url = nats://127.0.0.1:4222
nats_client_name = sfu_nats_client

[buffers]
packet_buf_size = 2048
packet_pool_capacity = 262144
provided_buf_count = 8192
provided_buf_group_id = 0

[queues]
worker_queue_capacity = 16384
fanout_ring_capacity = 4096
fanout_job_pool_capacity = 16384
release_queue_capacity = 8192
