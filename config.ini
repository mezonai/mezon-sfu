[server]
log_level = 1
media_port = 7000
signaling_port = 8000
public_host = 127.0.0.1
jwt_secret = default

[nats]
nats_url = nats://127.0.0.1:4222
nats_client_name = sfu_nats_client
nats_hook_topic = mezon_sfu_hook_event

[buffers]
packet_buf_size = 2048
packet_pool_capacity = 262144
provided_buf_count = 8192
provided_buf_group_id = 0

[queues]
worker_queue_capacity = 16384
fanout_ring_capacity = 4096
fanout_job_pool_capacity = 16384
release_queue_capacity = 8192

[bandwidth]
video_pool_percent = 85
source_admission_bps = 240000
screen_preferred_bps = 2000000
screen_mid_bps = 3000000
screen_cap_bps = 3500000
camera_mid_bps = 720000
camera_cap_bps = 1000000

[af_xdp]
interface = enp1s0
queues = auto
frame_count = 16384
frame_size = 4096
mode = native
